resolution:
  width: 1920
  height: 1080

render:
  max_bounces: 10
  gamma: 2.2
  exposure: 1.0
  epsilon: 0.001

camera:
  pos: [0, 3, 12]
  dir: [0, -0.15, -1]
  fov: 60

ambient: [0, 0, 0]
background: [20, 25, 40]

lights:
  # Point light (warm, main)
  - type: point
    pos: [8, 10, 8]
    intensity: 1.5
    color: [255, 240, 220]
  - type: point
    pos: [0, 5, 0]
    intensity: 1.5
    color: [255, 255, 255]
  # Directional light (cool fill)
  - type: directional
    dir: [1, -1, -0.5]
    intensity: 0.4
    color: [200, 220, 255]
  # Spot light (accent)
  - type: spot
    pos: [0, 8, 2]
    dir: [0, -1, -0.3]
    intensity: 1.5
    angle: 25
    color: [255, 255, 255]

objects:

  # Floor
  - type: plane
    pos: [0, -1.5, 0]
    normal: [0, 1, 0]
    color: [180, 180, 180]
    reflection: 0.15

  # Back wall
  - type: plane
    pos: [0, 0, -12]
    normal: [0, 0, 1]
    color: [100, 110, 130]

  # Sphere (front left)
  - type: sphere
    pos: [-4, 0, -2]
    radius: 1.5
    color: [255, 80, 80]
    reflection: 0.4

  # Box/Cube (front right)
  - type: box
    pos: [4, 0, -2]
    size: [1.2, 1.2, 1.2]
    color: [80, 255, 80]
    reflection: 0.3

  # Cylinder (back left)
  - type: cylinder
    pos: [-4, 0, -6]
    radius: 1.0
    color: [80, 80, 255]
    reflection: 0.2

  # Cone (back right)
  - type: cone
    pos: [4, -1.5, -6]
    radius: 1.0
    color: [255, 200, 80]
    reflection: 0.2

  # Torus (center)
  - type: torus
    pos: [0, 0.5, -4]
    major: 1.5
    minor: 0.4
    color: [200, 80, 255]
    reflection: 0.5

  # Mobius strip (center back)
  - type: mobius
    pos: [0, 1, 8]
    radius: 2.0
    width: 0.6
    color: [255, 255, 200]
    reflection: 0.3

  # Glass sphere
  - type: sphere
    pos: [0, 0, 0]
    radius: 1.0
    color: [255, 255, 255]
    transparency: 0.9
    ior: 1.5
    reflection: 0.1
