resolution:
  width: 1920
  height: 1080

render:
  max_bounces: 10
  gamma: 2.2
  exposure: 1.2
  epsilon: 0.0001

camera:
  pos: [0, 5, 10]
  dir: [0, -0.3, -1]
  fov: 60

ambient: [20, 20, 25]
background: [10, 12, 20]

lights:
  # Warm point light (left)
  - type: point
    pos: [-6, 6, 2]
    intensity: 1.2
    color: [255, 200, 150]

  # Cool directional light (from right)
  - type: directional
    dir: [-1, -0.5, 0]
    intensity: 0.5
    color: [150, 200, 255]

  # White spot light (center, pointing down)
  - type: spot
    pos: [0, 8, 0]
    dir: [0, -1, 0]
    intensity: 2.0
    angle: 30
    color: [255, 255, 255]

  # Red spot (left accent)
  - type: spot
    pos: [-4, 4, 4]
    dir: [0.5, -0.5, -0.7]
    intensity: 1.5
    angle: 20
    color: [255, 100, 100]

  # Blue spot (right accent)
  - type: spot
    pos: [4, 4, 4]
    dir: [-0.5, -0.5, -0.7]
    intensity: 1.5
    angle: 20
    color: [100, 100, 255]

objects:
  # Floor
  - type: plane
    pos: [0, -1, 0]
    normal: [0, 1, 0]
    color: [200, 200, 200]
    reflection: 0.1

  # Center sphere (white, reflective)
  - type: sphere
    pos: [0, 1, 0]
    radius: 2.0
    color: [255, 255, 255]
    reflection: 0.6

  # Left sphere (matte red)
  - type: sphere
    pos: [-2, 0.5, 0]
    radius: 1.5
    color: [255, 80, 80]

  # Right sphere (matte blue)
  - type: sphere
    pos: [4, 0.5, 0]
    radius: 1.5
    color: [80, 80, 255]

  # Back box (green)
  - type: box
    pos: [0, 0, -5]
    size: [1.5, 1.5, 1.5]
    color: [80, 200, 80]
    reflection: 0.2
