resolution:
  width: 1920
  height: 1080

camera:
  pos: [0, 1, 0]
  dir: [0, 0, -1]
  fov: 60.0

render:
  max_bounces: 100

lights:
  - pos: [0, 10, 1000000]
    intensity: 1.2
  - pos: [5, 5, 5]
    intensity: 1.2
  - pos: [-5, 5, 2]
    intensity: 0.5

objects:
  - type: sphere
    pos: [0, 0, -5]
    radius: 1.5
    color: [255, 0, 0]
    reflection: 0.5

  - type: sphere
    pos: [2, 1.5, -4]
    radius: 1.0
    color: [0, 0, 255]
    reflection: 0.5

  - type: plane
    pos: [0, -1.5, 0]
    normal: [0, 1, 0]
    color: [200, 200, 200]

  - type: box
    pos: [1, 0, -7]
    normal: [0, 0, 1]
    size: [4, 4, 0.1]
    color: [255, 255, 255]
    reflection: 0.8
