resolution:
  width: 1920
  height: 1080
  ambient: [100, 100, 100]

camera:
  pos: 123
  dir: [0, 0, -1]
  fov: 70.0

lights:
  - pos: [4, 4, 2]
    intensity: 1.5
  - pos: [-4, 2, 4]
    intensity: 0.8
  - pos: [0, 10, -10]
    intensity: 1.2

objects:
  # Floor
  - type: plane
    pos: [0, -2, 0]
    normal: [0, 1, 0]
    color: [100, 100, 100]
    reflection: 0.3

  # Mirror Wall
  - type: plane
    pos: [0, 0, -15]
    normal: [0, 0, 1]
    color: [0, 0, 0]
    reflection: 0.4

  # Central "Glass" Sphere
  - type: sphere
    pos: [0, 0, -5]
    radius: 1.5
    color: [255, 255, 255]
    reflection: 0.9
    transparency: 0.8
    ior: 2.5

  # Reflective Sphere
  - type: sphere
    pos: [-3, 0.5, -4]
    radius: 1.0
    color: [255, 200, 0]
    reflection: 0.7

  # Solid Sphere
  - type: sphere
    pos: [3, 0.5, -6]
    radius: 0.8
    color: [0, 255, 255]
